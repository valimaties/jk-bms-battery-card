name: Release

# Publishing a GitHub release builds the card and attaches it to the release:
#   - jk-bms-battery-card.js  (what the Home Assistant Marketplace installs for a dashboard card, see hacs.json)
#   - jk-bms-battery-card.zip (card + translations folder, for a manual install)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (the version comes from the release tag)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: CARD_VERSION="${RELEASE_TAG#v}" npm run build
      - name: Build the archive
        working-directory: dist
        run: zip -r ../jk-bms-battery-card.zip jk-bms-battery-card.js translations
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" jk-bms-battery-card.zip dist/jk-bms-battery-card.js --clobber
