name: Release

# Publishing a GitHub release builds the card and attaches it to the release (all translations are bundled in the file):
#   - jk-bms-battery-card.js  (what the Home Assistant Marketplace installs for a dashboard card, see hacs.json)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (the version comes from the release tag)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: CARD_VERSION="${RELEASE_TAG#v}" npm run build
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/jk-bms-battery-card.js --clobber
