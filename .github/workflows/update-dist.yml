name: Update dist

# On every push to dev that changes the sources, rebuild dist/ and commit it, so the check in validate.yml stays green.
# (main is protected: dist/ reaches it through the pull request from dev.)

on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "translations/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    name: Rebuild dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit dist/ if it changed
        run: |
          if git diff --quiet -- dist; then echo "dist/ is up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Rebuild dist"
          git push
